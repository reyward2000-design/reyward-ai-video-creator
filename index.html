<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REYWARD Video Studio</title><style>body{font:16px system-ui;background:#111827;color:white;margin:0;padding:20px}main{max-width:760px;margin:auto}h1{color:#6ee7b7}section{background:#1f2937;border-radius:14px;padding:18px;margin:16px 0}video{width:100%;max-height:440px;background:black}label{display:block;margin:12px 0}input[type=number]{width:90px;padding:8px}button{background:#6ee7b7;border:0;border-radius:8px;padding:12px;margin:5px;font-weight:bold}button:disabled{opacity:.4}small{color:#cbd5e1}</style></head><body><main><h1>REYWARD Video Studio</h1><p>Free, local video trimming. Your videos stay on your device.</p><section><label>Upload video <input id="file" type="file" accept="video/*"></label><video id="video" controls playsinline></video><p id="info"></p></section><section><h2>Trim</h2><label>Start (seconds) <input id="start" type="number" min="0" step=".1" value="0"></label><label>End (seconds) <input id="end" type="number" min="0" step=".1" value="0"></label><button id="preview" disabled>Preview selection</button><button id="export" disabled>Export clip</button><p id="status" role="status"></p></section><small>Experimental export uses real-time browser recording and may save as WebM. iPhone browsers may not support export. MP4 and AI features are not yet included.</small></main><script>
const q=s=>document.querySelector(s),v=q('#video'),f=q('#file'),s=q('#start'),e=q('#end'),p=q('#preview'),x=q('#export'),status=q('#status');let url;
f.onchange=()=>{if(url)URL.revokeObjectURL(url);if(!f.files[0])return;url=URL.createObjectURL(f.files[0]);v.src=url;status.textContent=''};
v.onloadedmetadata=()=>{s.value=0;e.value=v.duration.toFixed(1);q('#info').textContent='Duration: '+e.value+' seconds';p.disabled=x.disabled=false};
function bounds(){const a=+s.value,b=+e.value;if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<=a||b>v.duration+.05)throw Error('Enter valid start and end times.');return[a,b]}
p.onclick=async()=>{try{const[a,b]=bounds();v.pause();v.currentTime=a;await v.play();const check=()=>{if(v.currentTime>=b){v.pause();v.removeEventListener('timeupdate',check)}};v.addEventListener('timeupdate',check)}catch(err){status.textContent=err.message}};
x.onclick=async()=>{let rec;try{const[a,b]=bounds();if(!v.captureStream||!window.MediaRecorder)throw Error('Export unsupported here. Try Chrome or Edge on Windows.');x.disabled=true;v.pause();v.currentTime=a;await new Promise(resolve=>v.addEventListener('seeked',resolve,{once:true}));const stream=v.captureStream(),mime=['video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);const chunks=[];rec.ondataavailable=t=>{if(t.data.size)chunks.push(t.data)};const done=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=()=>reject(Error('Recording failed'))});rec.start();status.textContent='Recording in real time...';await v.play();await new Promise(resolve=>{const timer=setInterval(()=>{if(v.currentTime>=b||v.ended){clearInterval(timer);resolve()}},50)});rec.stop();v.pause();await done;const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'}),link=document.createElement('a'),out=URL.createObjectURL(blob);link.href=out;link.download='reyward-clip.webm';link.click();setTimeout(()=>URL.revokeObjectURL(out),30000);status.textContent='Export complete.'}catch(err){if(rec?.state==='recording')rec.stop();status.textContent=err.message}finally{x.disabled=false}};
</script></body></html>
